nameOverride: ""

replicaCount: 1

kind: Deployment

image:
  repository: nginx
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []

secrets:
  enabled: false
  vault:
    enabled: false
    # Team identifier (e.g. "dev", "qa"). Combined with .Release.Namespace to
    # derive role <team>-<namespace>-db and secret path <team>-<namespace>/creds/<team>.
    team: ""
    # Optional per-service overrides (defaults applied in the chart):
    # authPath:     "auth/dev-cluster"
    # service:      "http://vault.vault.svc.cluster.local:8200"
    # agentCache:   true
    # refreshUrl:   "http://127.0.0.1:8080/actuator/refresh"
    # role:         derived from team+namespace
    # secretPath:   derived from team+namespace
   
    # List of env-var names to inject from the vault secret. The vault field
    # is derived from the last underscore-separated segment, lowercased:
    #   MASTER_DB_USERNAME -> .Data.username
    #   MASTER_DB_PASSWORD -> .Data.password
    keys: 
      - MASTER_DB_USERNAME
      - MASTER_DB_PASSWORD
    

service:
  - name: api
    type: ClusterIP
    targetPort: 8080
    port: 80

ingress:
  enabled: false

liveness:
  enabled: true
  method: http
  service: api
  path: "/actuator/health/liveness"
  initialDelaySeconds: 0
  periodSeconds: 24
  successThreshold: 1
  failureThreshold: 5

readiness:
  enabled: true
  method: http
  service: api
  path: "/actuator/health/readiness"
  initialDelaySeconds: 0
  periodSeconds: 20
  successThreshold: 1
  failureThreshold: 3

startup:
  enabled: true
  method: http
  service: api
  path: "/actuator/health/readiness"
  initialDelaySeconds: 10
  periodSeconds: 5
  successThreshold: 1
  failureThreshold: 60

resources:
  requests:
    memory: "500Mi"
    cpu: "500m"
  limits:
    memory: "2Gi"
    cpu: "1000m"

volumes: []

podSpec: {}
container: {}
