nameOverride: ""

replicaCount: 1

kind: Deployment

image:
  repository: nginx
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - image-pull-secret

secrets:
  enabled: false
  vault:
    enabled: false
    path: ""

service:
  - name: web
    type: ClusterIP
    targetPort: 8080
    port: 80

ingress:
  enabled: false

liveness:
  enabled: true
  method: http
  service: web
  path: "/"
  initialDelaySeconds: 70
  periodSeconds: 1
  successThreshold: 1
  failureThreshold: 5

readiness:
  enabled: true
  method: http
  service: web
  path: "/"
  initialDelaySeconds: 70
  periodSeconds: 1
  successThreshold: 1
  failureThreshold: 5

resources:
  requests:
    memory: "500Mi"
    cpu: "500m"
  limits:
    memory: "2Gi"
    cpu: "1000m"

volumes: []

podSpec:
  annotations: { }
  securityContext: { }
container:
  annotations: { }
  securityContext: { }
