{{- if .Values.ingress.enabled -}}
{{- $servicePrefix := .Values.nameOverride | default .Release.Name -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $servicePrefix }}-ingress
  {{- with .Values.ingress.annotations }}
  labels:
    onechart.kubernetes.io/name: {{ $servicePrefix }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $servicePrefix }}-{{ .service }}-service
                port:
                  name: {{ .service }}
          {{- end }}
    {{- end }}
{{- end }}
